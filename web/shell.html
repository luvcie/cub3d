<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cub3D</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    #canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      image-rendering: pixelated;
      outline: none;
    }
    #status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #888;
      font-family: monospace;
      font-size: 14px;
    }
    #hint {
      color: #777;
      font-family: monospace;
      font-size: 12px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="status">Loading...</div>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="hint">WASD move &middot; arrows look &middot; M minimap &middot; H help &middot; click to focus</div>
  <script>
    var statusEl = document.getElementById('status');
    var canvas = document.getElementById('canvas');

    var mapName = new URLSearchParams(location.search).get('map') || 'pillars';
    if (!/^[a-z_]+$/.test(mapName))
      mapName = 'pillars';

    canvas.addEventListener('click', function () {
      canvas.focus();
    });

    var Module = {
      canvas: canvas,
      arguments: ['maps/' + mapName + '.cub'],
      setStatus: function (text) {
        if (!text)
          statusEl.style.display = 'none';
        else
          statusEl.textContent = text;
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
